name: Forecast on new AI tournament questions

on:
  push:
    branches: [main]
    paths:
      - superforecaster.py
      - main.py
      - probability_parsing.py
      - project_discovery.py
      - operations.py
      - audit_bot.py
      - .github/workflows/run_bot_on_tournament.yaml
  workflow_dispatch:
    inputs:
      max_questions:
        description: Maximum questions to process
        required: true
        default: '5'
      trigger_source:
        description: Trigger origin (external clock respects BOT_ENABLED)
        type: choice
        options: [manual, external-clock]
        default: manual
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: futureeval-publishing
  cancel-in-progress: false

jobs:
  forecast_job:
    if: vars.BOT_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'external-clock')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover open questions and read remaining credit (no model calls)
        id: coverage
        run: python audit_bot.py --preflight
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOT_AUDIT_OUTPUT: forecast_reports/coverage_before.json
      - uses: snok/install-poetry@v1
        if: steps.coverage.outputs.has_pending == 'true' && vars.PUBLISH_TO_METACULUS == 'true'
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies only when a forecast is needed
        if: steps.coverage.outputs.has_pending == 'true' && vars.PUBLISH_TO_METACULUS == 'true'
        run: poetry install --no-interaction --no-root
      - name: Run bot
        if: steps.coverage.outputs.has_pending == 'true' && vars.PUBLISH_TO_METACULUS == 'true'
        run: poetry run python superforecaster.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBLISH_TO_METACULUS: ${{ vars.PUBLISH_TO_METACULUS || 'false' }}
          MAX_QUESTIONS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_questions || vars.MAX_QUESTIONS_PER_RUN || '5' }}
      - name: Refresh coverage after submissions
        if: always() && steps.coverage.outputs.has_pending == 'true' && vars.PUBLISH_TO_METACULUS == 'true'
        run: python audit_bot.py --preflight
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOT_AUDIT_OUTPUT: forecast_reports/coverage_after.json
      - name: Explain disabled publishing
        if: vars.PUBLISH_TO_METACULUS != 'true'
        run: echo 'Publishing is disabled. Coverage check only; no model calls.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-forecast-reports
          path: forecast_reports/
          if-no-files-found: warn
          retention-days: 90
