name: Bot offline checks

on:
  workflow_dispatch:
  push:
    branches: [main, improve/coverage-2026-10-16]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Offline unit and orchestration checks (all network mocked)
        run: poetry run python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: External clock checks (no credentials or live dispatches)
        run: node --test ops/clock/worker.test.mjs
