name: Read-only bot audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [improve/coverage-2026-10-16, fix/partial-outages-2026-10-17]
    paths: [audit_bot.py, operations.py, project_discovery.py, .github/workflows/audit_bot.yaml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read coverage and remaining credit
        run: python audit_bot.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install existing review tool
        run: poetry install --no-interaction --no-root --with integrations
      - name: Review resolved forecasts only
        run: poetry run bot-review review --resolved-since 30 --output review.json --summary review.md
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Show score review
        if: always()
        run: |
          if [ -f review.md ]; then
            cat review.md
            cat review.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-only-audit
          path: |
            bot_audit.json
            review.json
            review.md
          if-no-files-found: ignore
          retention-days: 90
